name: Build and Verify Docker Container

on:
  push:
    branches: [ "main" ]

jobs:
  docker-build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t yogiraj-docker-app:v1 .

      - name: Run Docker Container
        run: |
          docker run -d -p 5000:5000 --name test_container yogiraj-docker-app:v1
          sleep 3
          docker ps

      - name: Test Web Application Inside Container
        run: curl -f http://localhost:5000/

      - name: Verify Docker Compose Setup (Bonus)
        run: docker compose config
